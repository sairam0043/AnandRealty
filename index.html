<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anand Realty | Built on Loyalty & Trust | Premier Real Estate Advisory in India</title>
    <meta name="description" content="Anand Realty is your trusted real estate partner in India, offering transparent property solutions, premium homes, commercial spaces, and comprehensive property advisory." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                50: '#FBF8F0',
                100: '#F5EED9',
                200: '#EBDCB0',
                300: '#DEC580',
                400: '#D4AF37',
                500: '#C29828',
                600: '#A47D1C',
                700: '#816017',
              }
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            animation: {
              'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'scale-up': 'scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'float': 'float 4s ease-in-out infinite',
              'pulse-slow': 'pulseSlow 3s ease-in-out infinite',
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(24px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleUp: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.85', transform: 'scale(1.02)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #F8F9FA;
        color: #0F172A;
        overflow-x: hidden;
      }
      ::selection {
        background: #D4AF37;
        color: #FFFFFF;
      }
      /* Custom luxury scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D4AF37;
      }

      /* Luxury Button Shimmer Effect (as seen in high-end sites like Treysta) */
      .btn-shimmer {
        position: relative;
        overflow: hidden;
      }
      .btn-shimmer::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );
        transform: skewX(-20deg);
        transition: left 0.75s ease-out;
      }
      .btn-shimmer:hover::before {
        left: 180%;
      }

      /* Card subtle shine */
      .card-shine {
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.3s ease;
      }
      .card-shine:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.08), 0 10px 15px -5px rgba(212, 175, 55, 0.05);
      }

      /* Treysta-Style Sliding Windows Animation on Scroll */
      .window-slide-left {
        opacity: 0;
        transform: translateX(-80px);
        transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity;
      }

      .window-slide-right {
        opacity: 0;
        transform: translateX(80px);
        transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity;
      }

      .window-slide-up {
        opacity: 0;
        transform: translateY(50px);
        transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity;
      }

      /* Triggered on viewport intersection */
      .window-revealed.window-slide-left,
      .window-revealed.window-slide-right,
      .window-revealed.window-slide-up {
        opacity: 1 !important;
        transform: translate(0, 0) !important;
      }

      /* Stagger Delays */
      .delay-100 { transition-delay: 100ms; }
      .delay-150 { transition-delay: 150ms; }
      .delay-200 { transition-delay: 200ms; }
      .delay-250 { transition-delay: 250ms; }
      .delay-300 { transition-delay: 300ms; }
      .delay-400 { transition-delay: 400ms; }
      .delay-500 { transition-delay: 500ms; }

      @media (max-width: 640px) {
        .window-slide-left {
          transform: translateX(-35px);
        }
        .window-slide-right {
          transform: translateX(35px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
